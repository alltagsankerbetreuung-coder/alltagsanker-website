<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anker-Emblem von Alltagsanker">
  <defs>
    <linearGradient id="ae-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5f4"/><stop offset="1" stop-color="#fdfbf7"/>
    </linearGradient>
    <!-- userSpaceOnUse: sonst werden gerade Linien mit Verlauf nicht gezeichnet -->
    <linearGradient id="ae-anchor" gradientUnits="userSpaceOnUse" x1="180" y1="108" x2="180" y2="244">
      <stop offset="0" stop-color="#2f8a92"/><stop offset="1" stop-color="#155057"/>
    </linearGradient>
    <filter id="ae-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f6f78" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="180" cy="180" r="150" fill="url(#ae-bg)"/>

  <!-- Tau als Kreis -->
  <circle cx="180" cy="180" r="128" fill="none" stroke="#e0d3bd" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="20 14"/>

  <circle cx="180" cy="180" r="104" fill="#ffffff" filter="url(#ae-shadow)"/>

  <!-- Anker -->
  <g fill="none" stroke="url(#ae-anchor)" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="180" cy="128" r="14"/>
    <path d="M180 142 L180 234"/>
    <path d="M150 164 L210 164"/>
    <path d="M134 192 q0 44 46 44 q46 0 46 -44"/>
    <path d="M134 192 L122 199"/>
    <path d="M226 192 L238 199"/>
  </g>
</svg>
