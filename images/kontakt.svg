<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nehmen Sie Kontakt auf – ein Briefumschlag mit Anker">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5f4"/>
      <stop offset="1" stop-color="#fdfbf7"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="440" height="320" rx="34" fill="url(#bg4)"/>

  <!-- chat bubble -->
  <g transform="translate(300 70)">
    <path d="M0 0 L120 0 Q140 0 140 20 L140 70 Q140 90 120 90 L40 90 L18 112 L22 90 L0 90 Q-20 90 -20 70 L-20 20 Q-20 0 0 0Z"
          transform="translate(20 0)" fill="#e8985e" opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="60" cy="45" r="7"/>
      <circle cx="90" cy="45" r="7"/>
      <circle cx="120" cy="45" r="7"/>
    </g>
  </g>

  <!-- envelope -->
  <g transform="translate(90 150)">
    <rect x="0" y="0" width="230" height="150" rx="16" fill="#1f6f78"/>
    <path d="M0 16 L115 96 L230 16" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- anchor stamp -->
    <g transform="translate(190 34)" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <circle cx="0" cy="-12" r="5"/>
      <line x1="0" y1="-7" x2="0" y2="18"/>
      <line x1="-11" y1="0" x2="11" y2="0"/>
      <path d="M-16 8 Q-16 22 0 22 Q16 22 16 8"/>
    </g>
  </g>
</svg>
