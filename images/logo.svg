<svg viewBox="0 0 1010 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alltagsfels Betreuung – Unterstützung, Vertrauen, Miteinander">
  <!-- ===== Emblem: Haus mit Herz und Fels ===== -->
  <g fill="none" stroke="#1c4c88" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dach -->
    <path d="M130 20 L28 100 M130 20 L232 100"/>
    <!-- Wände + geschwungener Boden -->
    <path d="M40 100 L52 192 Q130 214 208 192 L220 100"/>
  </g>

  <!-- Fels -->
  <g>
    <path d="M58 188 L88 150 L106 170 L128 142 L170 188 Z" fill="#2f6098"/>
    <path d="M128 142 L148 166 L110 172 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Herz -->
  <path d="M130 70 C114 44 78 46 72 78 C67 104 100 128 130 156 C160 128 193 104 188 78 C182 46 146 44 130 70 Z"
        fill="#e21f28"/>

  <!-- ===== Schriftzug ===== -->
  <text x="286" y="130" font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
        font-size="112" font-weight="700" fill="#1c4c88" letter-spacing="1">Alltagsfels</text>

  <!-- BETREUUNG mit flankierenden Linien -->
  <g>
    <text x="580" y="182" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="600" fill="#6cb43f" letter-spacing="11">BETREUUNG</text>
    <line x1="358" y1="173" x2="422" y2="173" stroke="#6cb43f" stroke-width="4" stroke-linecap="round"/>
    <line x1="738" y1="173" x2="802" y2="173" stroke="#6cb43f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
