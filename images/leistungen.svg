<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unterstützung im Alltag: Einkaufen, Spaziergang und Zeit zu zweit">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#fdfbf7"/>
    </linearGradient>
  </defs>

  <circle cx="300" cy="240" r="220" fill="url(#bg3)"/>

  <!-- path -->
  <path d="M90 400 Q300 350 510 400" fill="none" stroke="#1f6f78" stroke-width="6" opacity="0.18" stroke-linecap="round"/>

  <!-- bench -->
  <g transform="translate(360 300)">
    <rect x="0" y="0" width="150" height="12" rx="4" fill="#9a7b5a"/>
    <rect x="0" y="-34" width="150" height="10" rx="4" fill="#a98a67"/>
    <rect x="6" y="10" width="10" height="40" rx="3" fill="#7d6247"/>
    <rect x="134" y="10" width="10" height="40" rx="3" fill="#7d6247"/>
  </g>

  <!-- two seated figures -->
  <g transform="translate(388 236)">
    <circle cx="0" cy="0" r="20" fill="#f0c9a8"/>
    <path d="M-18 20 Q0 10 18 20 L22 74 L-22 74 Z" fill="#1f6f78"/>
    <path d="M-14 -4 Q-10 -26 0 -26 Q10 -26 14 -4 Q4 -14 -14 -4Z" fill="#6b4f3a"/>
  </g>
  <g transform="translate(452 232)">
    <circle cx="0" cy="0" r="20" fill="#f2d3b5"/>
    <path d="M-18 20 Q0 10 18 20 L22 78 L-22 78 Z" fill="#e8985e"/>
    <path d="M-14 -4 Q-10 -26 0 -26 Q10 -26 14 -4 Q4 -14 -14 -4Z" fill="#d9d9d9"/>
  </g>

  <!-- standing figure with shopping bag -->
  <g transform="translate(170 250)">
    <!-- legs -->
    <rect x="-14" y="70" width="14" height="60" rx="7" fill="#154f56"/>
    <rect x="4" y="70" width="14" height="60" rx="7" fill="#1f6f78"/>
    <!-- body -->
    <path d="M-20 -6 Q0 -18 20 -6 L24 74 L-24 74 Z" fill="#1f6f78"/>
    <!-- head -->
    <circle cx="0" cy="-34" r="22" fill="#f0c9a8"/>
    <path d="M-17 -38 Q-14 -62 0 -62 Q14 -62 17 -38 Q4 -50 -17 -38Z" fill="#4a3726"/>
    <!-- arm + bag -->
    <path d="M18 6 Q34 20 36 40" stroke="#1f6f78" stroke-width="12" stroke-linecap="round" fill="none"/>
    <g transform="translate(30 44)">
      <rect x="0" y="0" width="34" height="40" rx="5" fill="#e8985e"/>
      <path d="M8 0 Q8 -12 17 -12 Q26 -12 26 0" stroke="#c9773f" stroke-width="4" fill="none"/>
    </g>
  </g>

  <!-- little plant -->
  <g transform="translate(110 372)">
    <rect x="-14" y="0" width="28" height="24" rx="4" fill="#c9773f"/>
    <path d="M0 0 Q-16 -22 -4 -34" stroke="#7fae9f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 0 Q16 -22 4 -34" stroke="#7fae9f" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
