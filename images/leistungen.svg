<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Betreuerin und Seniorin sitzen gemeinsam auf einer Parkbank mit Tee und Einkaufstasche">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edec"/><stop offset="0.6" stop-color="#eef3ea"/><stop offset="1" stop-color="#f7efe1"/>
    </linearGradient>
    <radialGradient id="l-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8b0"/><stop offset="0.5" stop-color="#f7c877"/><stop offset="1" stop-color="#f3b45e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l-hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3ded9"/><stop offset="1" stop-color="#a6cdc2"/></linearGradient>
    <linearGradient id="l-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc39a"/><stop offset="1" stop-color="#6fa87f"/></linearGradient>
    <linearGradient id="l-foliage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8dc09f"/><stop offset="1" stop-color="#5f9a7f"/></linearGradient>
    <linearGradient id="l-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b58a5f"/><stop offset="1" stop-color="#98704a"/></linearGradient>
    <linearGradient id="l-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8a92"/><stop offset="1" stop-color="#1a636b"/></linearGradient>
    <linearGradient id="l-terra" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efa66f"/><stop offset="1" stop-color="#dd8449"/></linearGradient>
    <radialGradient id="l-skin" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#f6d3b2"/><stop offset="1" stop-color="#eab892"/></radialGradient>
    <filter id="l-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="l-circle"><circle cx="300" cy="240" r="228"/></clipPath>
  </defs>

  <g clip-path="url(#l-circle)">
    <rect x="60" y="0" width="480" height="480" fill="url(#l-sky)"/>
    <circle cx="170" cy="140" r="105" fill="url(#l-sun)"/>
    <circle cx="170" cy="140" r="40" fill="#ffdf95"/>
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="420" cy="120" rx="40" ry="18"/><ellipse cx="448" cy="108" rx="28" ry="18"/><ellipse cx="392" cy="112" rx="24" ry="14"/>
    </g>
    <g stroke="#5c7c86" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55">
      <path d="M300 96 q6 -6 12 0 q6 -6 12 0"/><path d="M348 82 q5 -5 10 0 q5 -5 10 0"/>
    </g>

    <path d="M60 300 Q200 236 340 276 Q460 310 540 280 L540 480 L60 480 Z" fill="url(#l-hill)"/>
    <path d="M60 350 Q300 306 540 350 L540 480 L60 480 Z" fill="url(#l-grass)"/>

    <!-- tree right -->
    <g>
      <path d="M470 360 q4 -54 0 -88" stroke="#8a6a49" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="470" cy="262" r="48" fill="url(#l-foliage)"/>
      <circle cx="436" cy="280" r="30" fill="url(#l-foliage)"/>
      <circle cx="504" cy="280" r="30" fill="url(#l-foliage)"/>
      <circle cx="460" cy="250" r="26" fill="#a7d2b4" opacity="0.7"/>
    </g>
    <!-- bushes + flowers -->
    <g fill="url(#l-foliage)"><ellipse cx="110" cy="352" rx="44" ry="28"/><ellipse cx="82" cy="358" rx="28" ry="20"/></g>
    <g>
      <g transform="translate(150 384)"><line x1="0" y1="0" x2="0" y2="-15" stroke="#5f9a7f" stroke-width="2.5"/><circle cx="0" cy="-17" r="5" fill="#f2b6c6"/><circle cx="0" cy="-17" r="2" fill="#ffe08a"/></g>
      <g transform="translate(408 402)"><line x1="0" y1="0" x2="0" y2="-14" stroke="#5f9a7f" stroke-width="2.5"/><circle cx="0" cy="-16" r="4.5" fill="#f7d774"/><circle cx="0" cy="-16" r="2" fill="#e79a3c"/></g>
    </g>

    <!-- shadow under figures -->
    <ellipse cx="300" cy="424" rx="130" ry="16" fill="#3f7a6f" opacity="0.25" filter="url(#l-soft)"/>

    <!-- ===== Caregiver standing (left) ===== -->
    <g>
      <!-- legs -->
      <path d="M248 348 l-4 82 h16 l4 -80 Z" fill="#3a4a58"/>
      <path d="M270 348 l3 82 h16 l-1 -80 Z" fill="#465767"/>
      <path d="M236 430 q-6 6 5 8 h17 v-8 Z" fill="#2b3742"/>
      <path d="M283 430 q6 6 -5 8 h-16 v-8 Z" fill="#2b3742"/>
      <!-- torso -->
      <path d="M242 266 q26 -12 52 0 l4 84 q-32 10 -60 0 Z" fill="url(#l-teal)"/>
      <path d="M268 262 v86" stroke="#16545c" stroke-width="2" opacity="0.45"/>
      <path d="M252 262 l14 12 l14 -12" fill="none" stroke="#eef6f5" stroke-width="4" stroke-linejoin="round"/>
      <!-- near arm around senior's back -->
      <path d="M292 300 q28 4 46 22" stroke="url(#l-teal)" stroke-width="15" fill="none" stroke-linecap="round"/>
      <circle cx="338" cy="322" r="8" fill="url(#l-skin)"/>
      <!-- far arm holding bag handle -->
      <path d="M244 300 q-14 22 -14 52" stroke="#1a636b" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="230" cy="354" r="7.5" fill="url(#l-skin)"/>
      <!-- head -->
      <rect x="261" y="240" width="13" height="14" rx="6" fill="#eab892"/>
      <circle cx="268" cy="228" r="25" fill="url(#l-skin)"/>
      <path d="M243 228 q-2 -32 25 -33 q27 1 25 33 q-6 -16 -14 -17 q3 9 -3 15 q-4 -13 -11 -15 q2 11 -6 15 q-7 -2 -11 -8 q-2 6 0 13 q-6 -3 -7 -8 Z" fill="#7a5636"/>
      <path d="M291 224 q9 18 0 36 q9 -4 11 -16 q0 -14 -11 -20 Z" fill="#6b4a2f"/>
      <circle cx="260" cy="228" r="2.2" fill="#41352b"/><circle cx="275" cy="228" r="2.2" fill="#41352b"/>
      <path d="M256 222 q4 -3 8 -1 M271 222 q4 -2 8 1" stroke="#7a5636" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M261 238 q7 5 14 0" fill="none" stroke="#b5654f" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="254" cy="234" r="3" fill="#f2b39a" opacity="0.6"/><circle cx="281" cy="234" r="3" fill="#f2b39a" opacity="0.6"/>
    </g>

    <!-- ===== Senior standing (right) ===== -->
    <g>
      <path d="M336 350 l-3 80 h15 l3 -78 Z" fill="#7d6f8a"/>
      <path d="M360 350 l3 80 h15 l-2 -78 Z" fill="#8a7c96"/>
      <path d="M326 430 q-6 6 5 8 h16 v-8 Z" fill="#5a4d3f"/>
      <path d="M372 430 q6 6 -5 8 h-16 v-8 Z" fill="#5a4d3f"/>
      <path d="M328 272 q26 -12 50 0 q6 40 4 80 q-30 10 -58 0 q-2 -40 4 -80 Z" fill="url(#l-terra)"/>
      <path d="M353 264 v88" stroke="#cf7f45" stroke-width="2" opacity="0.5"/>
      <circle cx="353" cy="298" r="2.2" fill="#a7602f"/><circle cx="353" cy="314" r="2.2" fill="#a7602f"/><circle cx="353" cy="330" r="2.2" fill="#a7602f"/>
      <!-- arm toward caregiver -->
      <path d="M330 300 q-8 18 -4 40" stroke="#dd8449" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="327" cy="342" r="7" fill="#eab892"/>
      <!-- arm holding handbag -->
      <path d="M376 300 q10 14 10 34" stroke="#dd8449" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="386" cy="336" r="6.5" fill="#eab892"/>
      <g transform="translate(386 344)">
        <path d="M-14 0 q0 -10 14 -10 q14 0 14 10 l-2 20 h-24 Z" fill="#b5654f"/>
        <path d="M-8 -1 q0 -8 8 -8 q8 0 8 8" fill="none" stroke="#94493a" stroke-width="3"/>
      </g>
      <!-- head -->
      <rect x="347" y="248" width="12" height="14" rx="6" fill="#eab892"/>
      <circle cx="353" cy="236" r="24" fill="url(#l-skin)"/>
      <path d="M330 236 q-2 -30 23 -31 q25 1 23 31 q-6 -17 -23 -17 q-17 0 -23 17 Z" fill="#dcdcdc"/>
      <circle cx="353" cy="210" r="8" fill="#e6e6e6"/>
      <g stroke="#5a4d3f" stroke-width="1.7" fill="none">
        <circle cx="345" cy="236" r="6"/><circle cx="362" cy="236" r="6"/><path d="M351 235 h4"/><path d="M339 234 l-4 -2 M368 234 l4 -2"/>
      </g>
      <circle cx="345" cy="236" r="2" fill="#41352b"/><circle cx="362" cy="236" r="2" fill="#41352b"/>
      <path d="M348 245 q5 4 10 0" fill="none" stroke="#b5654f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="339" cy="242" r="2.8" fill="#f2b39a" opacity="0.6"/><circle cx="367" cy="242" r="2.8" fill="#f2b39a" opacity="0.6"/>
    </g>

    <!-- ===== Shopping bag (front left, by caregiver) ===== -->
    <g transform="translate(200 360)">
      <path d="M0 8 q4 -8 14 -8 h34 q10 0 14 8 l-4 46 q-1 6 -7 6 h-40 q-6 0 -7 -6 Z" fill="url(#l-terra)"/>
      <path d="M10 4 q0 -14 14 -14 q14 0 14 14" fill="none" stroke="#c9773f" stroke-width="4"/>
      <!-- veggies -->
      <circle cx="20" cy="-2" r="9" fill="#e0552f"/>
      <circle cx="36" cy="-4" r="9" fill="#f0a93a"/>
      <path d="M48 -6 q10 -20 4 -26 q-8 8 -4 26" fill="#7fae5f"/>
      <path d="M28 -8 q-2 -16 4 -22" stroke="#6fa87f" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <circle cx="300" cy="240" r="228" fill="none" stroke="#ffffff" stroke-width="9"/>
  <circle cx="300" cy="240" r="233" fill="none" stroke="#1f6f78" stroke-width="2" opacity="0.15"/>
</svg>
