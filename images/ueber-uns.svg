<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zwei Hände reichen sich mit einem Herz für Vertrauen und Nähe">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5f4"/>
      <stop offset="1" stop-color="#fdfbf7"/>
    </linearGradient>
  </defs>

  <rect x="30" y="30" width="500" height="420" rx="40" fill="url(#bg2)"/>

  <!-- soft dots -->
  <g fill="#1f6f78" opacity="0.08">
    <circle cx="90" cy="90" r="9"/>
    <circle cx="470" cy="120" r="12"/>
    <circle cx="120" cy="380" r="10"/>
    <circle cx="460" cy="370" r="8"/>
  </g>

  <!-- lower hand (caregiver) -->
  <g>
    <path d="M120 400 Q140 300 240 300 L300 300 Q330 300 330 330 Q330 356 300 356 L250 356 Q290 360 300 380 L300 400 Z"
          fill="#f0c9a8"/>
    <path d="M120 400 Q140 300 240 300 L300 300" fill="none" stroke="#e0b591" stroke-width="3" opacity="0.5"/>
    <!-- sleeve -->
    <path d="M96 402 Q100 372 148 366 L152 402 Z" fill="#1f6f78"/>
  </g>

  <!-- upper hand (senior) -->
  <g>
    <path d="M440 96 Q420 196 320 196 L262 196 Q232 196 232 166 Q232 140 262 140 L312 140 Q272 136 262 116 L262 96 Z"
          fill="#f2d3b5"/>
    <path d="M440 96 Q420 196 320 196 L262 196" fill="none" stroke="#e3bd98" stroke-width="3" opacity="0.5"/>
    <!-- sleeve -->
    <path d="M464 94 Q460 124 412 130 L408 94 Z" fill="#e8985e"/>
  </g>

  <!-- heart between hands -->
  <g transform="translate(280 248)">
    <path d="M0 20 C-26 -10 -58 8 -34 40 C-20 58 0 66 0 66 C0 66 20 58 34 40 C58 8 26 -10 0 20 Z"
          fill="#e8985e"/>
    <path d="M0 20 C-26 -10 -58 8 -34 40 C-20 58 0 66 0 66 C0 66 20 58 34 40 C58 8 26 -10 0 20 Z"
          fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
