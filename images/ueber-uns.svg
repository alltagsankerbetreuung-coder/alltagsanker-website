<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Betreuerin und Seniorin sitzen bei einer Tasse Tee zusammen und unterhalten sich">
  <defs>
    <linearGradient id="u-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="1" stop-color="#f3e7d2"/>
    </linearGradient>
    <linearGradient id="u-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0"/><stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <linearGradient id="u-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39a6b"/><stop offset="1" stop-color="#a5794d"/>
    </linearGradient>
    <linearGradient id="u-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8a92"/><stop offset="1" stop-color="#1a636b"/></linearGradient>
    <linearGradient id="u-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dd90a4"/><stop offset="1" stop-color="#c46f85"/></linearGradient>
    <radialGradient id="u-skin" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#f6d3b2"/><stop offset="1" stop-color="#eab892"/></radialGradient>
    <radialGradient id="u-skin2" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#e7b587"/><stop offset="1" stop-color="#d0975f"/></radialGradient>
    <radialGradient id="u-glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#fff3d6" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>
    <filter id="u-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect x="0" y="0" width="560" height="460" fill="url(#u-wall)"/>
  <ellipse cx="150" cy="150" rx="260" ry="220" fill="url(#u-glow)"/>

  <!-- window -->
  <g>
    <rect x="46" y="48" width="150" height="150" rx="8" fill="#ffffff"/>
    <rect x="54" y="56" width="134" height="134" rx="4" fill="url(#u-win)"/>
    <circle cx="150" cy="92" r="22" fill="#fff4d2" opacity="0.9"/>
    <path d="M60 150 q30 -26 60 -8 q30 16 60 -4 L188 190 L54 190 Z" fill="#ffcf8f" opacity="0.7"/>
    <rect x="118" y="56" width="6" height="134" fill="#ffffff"/>
    <rect x="54" y="118" width="134" height="6" fill="#ffffff"/>
    <rect x="42" y="196" width="158" height="10" rx="3" fill="#efe0c6"/>
  </g>
  <g transform="translate(70 176)">
    <path d="M-9 20 h30 l-4 -22 h-22 Z" fill="#c9773f"/>
    <path d="M0 -2 q-16 -18 -6 -34 M6 -2 q4 -22 18 -30 M4 -2 q16 -14 12 -30" fill="none" stroke="#5f9a7f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-6" cy="-36" r="3" fill="#f2b6c6"/><circle cx="24" cy="-32" r="3" fill="#f7d774"/>
  </g>

  <!-- framed picture -->
  <g>
    <rect x="392" y="70" width="120" height="96" rx="6" fill="#ffffff" stroke="#e2d3ba" stroke-width="6"/>
    <rect x="404" y="82" width="96" height="72" rx="3" fill="#d7ece9"/>
    <path d="M404 138 q28 -34 52 -10 q20 20 44 -2 v28 h-96 Z" fill="#9cc7bb"/>
    <circle cx="424" cy="102" r="10" fill="#ffe0a0"/>
  </g>
  <g transform="translate(470 176)">
    <path d="M-6 0 h20 l-3 16 h-14 Z" fill="#7fae9f"/>
    <path d="M-2 0 q-14 20 -8 34 M8 0 q14 18 8 34 M3 0 q0 24 0 34" fill="none" stroke="#5f9a7f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ===== Caregiver (dark bob, warm skin) left ===== -->
  <g>
    <path d="M150 300 q56 -30 108 -2 l6 60 h-120 Z" fill="url(#u-teal)"/>
    <path d="M182 292 l18 14 l18 -14" fill="none" stroke="#eef6f5" stroke-width="5" stroke-linejoin="round"/>
    <rect x="192" y="262" width="16" height="20" rx="7" fill="#d0975f"/>
    <!-- bob hair back -->
    <path d="M168 258 q-6 -60 32 -60 q38 0 32 60 q-4 -8 -10 -12 l0 -6 q-22 8 -44 0 l0 6 q-6 4 -10 12 Z" fill="#2f241b"/>
    <circle cx="200" cy="244" r="29" fill="url(#u-skin2)"/>
    <!-- fringe -->
    <path d="M172 236 q4 -26 28 -27 q24 1 28 27 q-8 -13 -20 -13 q-4 6 -8 7 q-2 -5 -4 -6 q-14 2 -24 12 Z" fill="#2f241b"/>
    <circle cx="191" cy="244" r="2.6" fill="#33261c"/><circle cx="209" cy="244" r="2.6" fill="#33261c"/>
    <path d="M186 237 q5 -3 9 -1 M205 237 q5 -3 9 -1" stroke="#2f241b" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M193 252 q7 5 14 0" fill="none" stroke="#b07a54" stroke-width="1.7"/>
    <path d="M191 258 q9 7 18 0" fill="none" stroke="#a3503f" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="182" cy="252" r="3.6" fill="#e08d78" opacity="0.5"/><circle cx="218" cy="252" r="3.6" fill="#e08d78" opacity="0.5"/>
    <path d="M250 320 q16 6 22 20" stroke="url(#u-teal)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <ellipse cx="274" cy="342" rx="9" ry="7" fill="url(#u-skin2)"/>
  </g>

  <!-- ===== Senior lady (white hair, rose cardigan, pearls) right ===== -->
  <g>
    <path d="M312 302 q52 -28 100 -2 l6 58 h-112 Z" fill="url(#u-rose)"/>
    <path d="M362 300 v58" stroke="#b25f76" stroke-width="2" opacity="0.5"/>
    <circle cx="360" cy="330" r="2.4" fill="#a5495f"/><circle cx="360" cy="346" r="2.4" fill="#a5495f"/>
    <rect x="352" y="266" width="15" height="19" rx="7" fill="#eab892"/>
    <!-- pearl necklace -->
    <g fill="#fdfbf4" stroke="#e7ddc9" stroke-width="0.6">
      <circle cx="344" cy="298" r="3"/><circle cx="352" cy="303" r="3"/><circle cx="360" cy="305" r="3.2"/><circle cx="368" cy="303" r="3"/><circle cx="376" cy="298" r="3"/>
    </g>
    <circle cx="360" cy="248" r="29" fill="url(#u-skin)"/>
    <!-- short white wavy hair -->
    <path d="M330 250 q-4 -40 30 -41 q34 1 30 41 q-4 -10 -9 -13 q-2 8 -6 9 q0 -10 -6 -13 q-3 8 -9 9 q-1 -8 -5 -10 q-4 8 -11 9 q-2 -7 -5 -8 q-4 8 -8 12 q-4 -2 -6 5 Z" fill="#eef0ef"/>
    <path d="M331 246 q6 -6 12 -4 M377 246 q-6 -6 -12 -4" stroke="#dfe2e0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="350" cy="248" r="2.6" fill="#41352b"/><circle cx="370" cy="248" r="2.6" fill="#41352b"/>
    <path d="M345 241 q5 -3 10 -1 M366 240 q5 -2 9 1" stroke="#cfd2d0" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M353 258 q7 5 14 0" fill="none" stroke="#b5654f" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="342" cy="255" r="3.6" fill="#f2a9b6" opacity="0.55"/><circle cx="378" cy="255" r="3.6" fill="#f2a9b6" opacity="0.55"/>
    <!-- earrings -->
    <circle cx="332" cy="262" r="2.2" fill="#f7d774"/><circle cx="388" cy="262" r="2.2" fill="#f7d774"/>
    <path d="M316 322 q-14 6 -20 20" stroke="url(#u-rose)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <ellipse cx="294" cy="344" rx="9" ry="7" fill="url(#u-skin)"/>
  </g>

  <!-- ===== table + tea ===== -->
  <ellipse cx="280" cy="360" rx="240" ry="20" fill="#3f2f1e" opacity="0.12" filter="url(#u-soft)"/>
  <rect x="24" y="352" width="512" height="86" rx="14" fill="url(#u-table)"/>
  <rect x="24" y="352" width="512" height="12" rx="6" fill="#d3ab7c"/>

  <g transform="translate(250 356)">
    <path d="M-16 -14 q3 -3 6 0" stroke="#cbd6d6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="16" rx="22" ry="6" fill="#ffffff"/>
    <path d="M-18 0 h36 v6 a18 10 0 0 1 -36 0 Z" fill="#ffffff" stroke="#e3ddd0" stroke-width="1.5"/>
    <path d="M18 2 q10 0 9 9 q-1 7 -9 6" fill="none" stroke="#e3ddd0" stroke-width="2.4"/>
    <path d="M-14 -1 h28 v2 a14 4 0 0 1 -28 0 Z" fill="#a5794d" opacity="0.5"/>
  </g>
  <g transform="translate(322 356)">
    <path d="M14 -14 q-3 -3 -6 0" stroke="#cbd6d6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="16" rx="22" ry="6" fill="#ffffff"/>
    <path d="M-18 0 h36 v6 a18 10 0 0 1 -36 0 Z" fill="#ffffff" stroke="#e3ddd0" stroke-width="1.5"/>
    <path d="M18 2 q10 0 9 9 q-1 7 -9 6" fill="none" stroke="#e3ddd0" stroke-width="2.4"/>
    <path d="M-14 -1 h28 v2 a14 4 0 0 1 -28 0 Z" fill="#a5794d" opacity="0.5"/>
  </g>
  <g transform="translate(286 352)">
    <path d="M-9 0 q-3 16 4 24 h10 q7 -8 4 -24 Z" fill="#e7f0ef"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#5f9a7f" stroke-width="2.4"/>
    <line x1="0" y1="-6" x2="-9" y2="-20" stroke="#5f9a7f" stroke-width="2.4"/>
    <line x1="0" y1="-6" x2="9" y2="-20" stroke="#5f9a7f" stroke-width="2.4"/>
    <circle cx="0" cy="-22" r="5" fill="#e2564f"/>
    <circle cx="-10" cy="-21" r="4.5" fill="#f2b6c6"/>
    <circle cx="10" cy="-21" r="4.5" fill="#f7d774"/>
  </g>
</svg>
